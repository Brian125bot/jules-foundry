[package]
name = "jules-foundry"
version = "1.0.0"
description = "Trusted-machine Jules orchestration console"
authors = ["Jules Foundry"]
edition = "2021"

[lib]
name = "jules_foundry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
rand = "0.8"
url = "2"
