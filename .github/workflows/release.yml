name: local-user-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: FOUNDRY_VAULT_MODE=passphrase FOUNDRY_VAULT_PASSPHRASE=ci-release-key pnpm check
      - run: FOUNDRY_VAULT_MODE=passphrase FOUNDRY_VAULT_PASSPHRASE=ci-release-key pnpm test:coverage
      - run: pnpm build
      - run: pnpm build:check-bundle
      - run: pnpm build:verify-output
      - run: pnpm release:policy
      - run: pnpm release:audit
      - run: pnpm release:sbom
      - uses: actions/upload-artifact@v4
        with: { name: verification-and-sbom, path: release }

  desktop:
    needs: verify
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:config:signed
        env:
          TAURI_UPDATE_PUBLIC_KEY: ${{ secrets.TAURI_UPDATE_PUBLIC_KEY }}
          TAURI_UPDATE_ENDPOINT: ${{ secrets.TAURI_UPDATE_ENDPOINT }}
      - run: pnpm desktop:prepare
      - run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: mkdir -p release && find src-tauri/target -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release/ \;
      - run: node scripts/create-checksums.mjs release
      - uses: actions/upload-artifact@v4
        with: { name: foundry-${{ matrix.target }}, path: release }
